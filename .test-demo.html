<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatLab Web UI - 演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .demo-info {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 30px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .demo-info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">💬</div>
            <h1>ChatLab Web UI</h1>
            <p class="subtitle">登录演示</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input
                    type="text"
                    id="username"
                    placeholder="输入用户名"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input
                    type="password"
                    id="password"
                    placeholder="输入密码"
                    required
                >
            </div>

            <button type="submit" class="button">登录</button>
            <div class="error-message" id="errorMsg"></div>
        </form>

        <div class="demo-info">
            <strong>✅ Web UI 实现状态:</strong><br>
            ✓ Phase 5 前端页面完成<br>
            ✓ Login.vue 登录界面<br>
            ✓ Dashboard.vue 仪表盘<br>
            ✓ Settings.vue 设置页面<br>
            <br>
            <strong>📚 文件清单:</strong><br>
            ✓ src/pages/Login.vue (353 行)<br>
            ✓ src/pages/Dashboard.vue (846 行)<br>
            ✓ src/pages/Settings.vue (962 行)<br>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            console.log('📤 提交登录:', { username });
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('http://localhost:9871/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }).catch(() => {
                    throw new Error('API 服务未运行');
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ 登录成功');
                    errorMsg.textContent = '✅ 登录成功！';
                    errorMsg.style.color = '#4caf50';
                    errorMsg.style.display = 'block';
                    setTimeout(() => { window.location.hash = '#/dashboard'; }, 1500);
                } else {
                    throw new Error('登录失败');
                }
            } catch (error) {
                console.error('❌ 错误:', error.message);
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.color = '#d32f2f';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
