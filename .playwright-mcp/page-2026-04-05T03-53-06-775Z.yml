      - generic [ref=e32]:
        - paragraph [ref=e33]:
          - text: 欢迎使用 ChatLab，它是一款
          - strong [ref=e34]: 开源、本地化的聊天记录分析工具
          - text: 。
        - paragraph [ref=e35]: 我们相信，你有权理解自己的社交数据。但聊天记录不只属于你，它同时承载着你朋友、家人、同事的话语与信任。因此，在使用本工具之前，请认真阅读以下条款。
        - heading "1. 核心功能与独立性" [level=2] [ref=e36]
        - list [ref=e37]:
          - listitem [ref=e38]:
            - text: •
            - strong [ref=e39]: 仅分析，不导出
            - text: ：本工具仅用于对已导出的聊天记录进行分析。我们不提供任何解密、抓包或导出工具，从第三方聊天软件获取数据是你的个人行为。
          - listitem [ref=e40]:
            - text: •
            - strong [ref=e41]: 第三方独立工具
            - text: ：本项目为独立开源项目，
            - strong [ref=e42]: 与任何聊天平台、公司或组织等无关联
            - text: 。
        - heading "2. 数据隐私与安全" [level=2] [ref=e43]
        - list [ref=e44]:
          - listitem [ref=e45]:
            - text: •
            - strong [ref=e46]: 纯本地分析
            - text: ：默认情况下，聊天记录的存储与分析均在你的设备本地完成，
            - strong [ref=e47]: 零上传
            - text: 。
          - listitem [ref=e48]:
            - text: •
            - strong [ref=e49]: AI 功能例外
            - text: ：若你主动启用 AI 功能，相关聊天数据将发送至你配置的第三方模型服务商（如 OpenAI、DeepSeek 或其他服务商）。请在使用前自行评估数据的敏感程度，
            - strong [ref=e50]: 避免发送高度私密的内容
            - text: 。该第三方服务商的隐私政策独立于本项目，请自行查阅。
          - listitem [ref=e51]:
            - text: •
            - strong [ref=e52]: 功能性联网
            - text: ：应用会通过网络获取更新提示、使用说明及配置信息。此过程不会上传任何本地数据。
          - listitem [ref=e53]:
            - text: •
            - strong [ref=e54]: 匿名使用统计
            - text: ：为了优化产品，软件会收集
            - strong [ref=e55]: 非敏感
            - text: 的数据（如版本号、操作系统类型等）。这些数据不含任何个人信息，你可以在设置中随时关闭此功能。
        - heading "3. 数据授权与使用限制" [level=2] [ref=e56]
        - paragraph [ref=e57]: 聊天记录中不只有你的数据——它同样包含对话另一方的内容。请在使用时遵守以下原则：
        - list [ref=e58]:
          - listitem [ref=e59]:
            - text: •
            - strong [ref=e60]: 合法授权原则
            - text: ：你仅可处理你
            - strong [ref=e61]: 本人参与
            - text: 的聊天记录。聊天记录中涉及的其他参与者同样拥有隐私权，若分析内容涉及特定个人隐私（
            - strong [ref=e62]: 私聊对象、群聊成员
            - text: ），请务必确保已获得相关人员的知情同意。
          - listitem [ref=e63]:
            - text: •
            - strong [ref=e64]: 禁止非法用途
            - text: ：
            - list [ref=e65]:
              - listitem [ref=e66]:
                - text: •
                - strong [ref=e67]: 严禁
                - text: 用于窃取、监控或分析未经授权的他人隐私。
              - listitem [ref=e68]:
                - text: •
                - strong [ref=e69]: 严禁
                - text: 分析通过非法手段（如非法入侵、账号窃取、数据劫持等）获取的聊天记录。
              - listitem [ref=e70]:
                - text: •
                - strong [ref=e71]: 严禁
                - text: 将分析结果用于骚扰、诈骗、人肉搜索或任何侵犯他人权益的行为。
              - listitem [ref=e72]:
                - text: •
                - strong [ref=e73]: 严禁
                - text: 利用本软件生成的分析内容（含 AI 生成内容）编造、传播虚假信息或误导性信息。
        - heading "4. 风险警告" [level=2] [ref=e74]
        - list [ref=e75]:
          - listitem [ref=e76]:
            - text: •
            - strong [ref=e77]: 官方渠道
            - text: ：请仅通过
            - link "chatlab.fun" [ref=e78] [cursor=pointer]:
              - /url: https://chatlab.fun
            - text: 或
            - link "GitHub Release" [ref=e79] [cursor=pointer]:
              - /url: https://github.com/hellodigua/ChatLab/releases
            - text: 下载本软件。
          - listitem [ref=e80]:
            - text: •
            - strong [ref=e81]: 供应链风险
            - text: ：本项目代码完全开源，任何人均可二次打包。他人分享的非官方版本可能会植入恶意代码，导致你的 API Token、聊天记录或本地数据泄露，请务必保持警惕。
          - listitem [ref=e82]:
            - text: •
            - strong [ref=e83]: 结果准确性
            - text: ：软件和 AI 生成的分析结果可能存在错误或"幻觉"，仅供参考，不应作为法律证据或正式决策依据。
        - heading "5. 免责声明" [level=2] [ref=e84]
        - list [ref=e85]:
          - listitem [ref=e86]:
            - text: •
            - strong [ref=e87]: 软件用途
            - text: ：本软件仅供技术研究、学习与交流目的使用。
          - listitem [ref=e88]:
            - text: •
            - strong [ref=e89]: 平台合规性
            - text: ：用户需自行承担获取聊天记录行为的合规性。若因分析行为违反了原始数据来源平台的服务条款而导致账号受限，作者不承担任何责任。
          - listitem [ref=e90]:
            - text: •
            - strong [ref=e91]: 隐私责任
            - text: ：若因你对本工具的使用方式侵犯了他人隐私权或其他合法权益，相关责任由你自行承担。
          - listitem [ref=e92]:
            - text: •
            - strong [ref=e93]: 责任自负
            - text: ：使用本软件产生的一切后果（包括但不限于数据丢失、隐私纠纷、法律责任）均由用户自行承担。
          - listitem [ref=e94]:
            - text: •
            - strong [ref=e95]: 适用法律
            - text: ：本声明适用你所在司法管辖区的相关法律。如本声明与当地强制性法律规定存在冲突，以当地法律为准。
          - listitem [ref=e96]:
            - text: •
            - strong [ref=e97]: 接受声明
            - text: ：下载、安装或使用本软件，即表示你已阅读、理解并同意本声明的所有条款。如不同意，请立即停止使用并删除相关程序。
